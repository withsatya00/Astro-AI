version: '3.8'

services:
  backend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
    ports:
      - "8005:8005"
    environment:
      - APP_ENV=production
      - DATABASE_URL=sqlite:///./astro_ai.db
      - LLM_PROVIDER=gemini
    volumes:
      - ../../astro_ai.db:/app/astro_ai.db
      - ../../storage:/app/storage

  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

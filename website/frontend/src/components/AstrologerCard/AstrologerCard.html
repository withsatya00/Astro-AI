<!-- Reusable Astrologer Card Component -->
<article class="astrologer-card" id="astrologer-card-template">
  <div class="card-main-row">
    <!-- Portrait with Status Indicator -->
    <div class="card-portrait-col">
      <div class="card-portrait-wrap">
        <img src="assets/portraits/default-avatar.svg" alt="Astrologer" class="card-portrait-img" loading="lazy" />
        <span class="status-indicator-dot status-online" title="Online"></span>
      </div>
      <div class="card-rating-badge">
        <span class="star-icon">★</span>
        <span class="rating-num">4.9</span>
      </div>
    </div>

    <!-- Metadata & Specializations -->
    <div class="card-info-col">
      <div class="card-name-row">
        <h3 class="card-astrologer-name">Astrologer Name</h3>
        <span class="verified-seal" title="Verified Vedic Scholar">✓</span>
      </div>
      <p class="card-title-line">Vedic Jyotish, Kundli & Vastu</p>
      <div class="card-specs-row">
        <span class="spec-pill">Kundli</span>
        <span class="spec-pill">Career</span>
      </div>
      <div class="card-exp-lang">
        <span>Exp: 15+ Yrs</span>
        <span>•</span>
        <span>Hindi, English</span>
      </div>
    </div>

    <!-- Pricing & Action Buttons -->
    <div class="card-actions-col">
      <div class="card-price-display">
        <span class="price-amount">₹25</span>
        <span class="price-unit">/ min</span>
      </div>
      <div class="card-btn-group">
        <button type="button" class="btn-card-chat">
          <span>💬 Chat Now</span>
        </button>
        <button type="button" class="btn-card-call">
          <span>📞 Call</span>
        </button>
      </div>
    </div>
  </div>
</article>

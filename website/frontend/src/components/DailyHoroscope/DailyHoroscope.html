<!-- Astro Jyotish — Your Daily Horoscope (Matching Reference media_1793439144869_15265fb2.jpg) -->
<div class="home-ref-horoscope-card" id="daily-horoscope-component">
  <div>
    <h3 class="home-ref-horoscope-title">Your Daily Horoscope</h3>
    <p class="home-ref-horoscope-sub">Read accurate horoscope about your day.</p>
  </div>

  <div class="home-ref-horoscope-glyph-wrap">
    <div class="home-ref-horoscope-glyph" id="home-horoscope-glyph" aria-hidden="true">♈</div>
  </div>

  <div class="home-ref-horoscope-controls">
    <select class="home-ref-horoscope-select" id="home-horoscope-select" onchange="const g = {Aries:'♈',Taurus:'♉',Gemini:'♊',Cancer:'♋',Leo:'♌',Virgo:'♍',Libra:'♎',Scorpio:'♏',Sagittarius:'♐',Capricorn:'♑',Aquarius:'♒',Pisces:'♓'}; document.getElementById('home-horoscope-glyph').textContent = g[this.value] || '♈';">
      <option value="Aries">Aries (Mesh)</option>
      <option value="Taurus">Taurus (Vrishabh)</option>
      <option value="Gemini">Gemini (Mithun)</option>
      <option value="Cancer">Cancer (Kark)</option>
      <option value="Leo">Leo (Singh)</option>
      <option value="Virgo">Virgo (Kanya)</option>
      <option value="Libra">Libra (Tula)</option>
      <option value="Scorpio">Scorpio (Vrishchik)</option>
      <option value="Sagittarius">Sagittarius (Dhanu)</option>
      <option value="Capricorn">Capricorn (Makar)</option>
      <option value="Aquarius">Aquarius (Kumbh)</option>
      <option value="Pisces">Pisces (Meen)</option>
    </select>

    <a href="/rashiphal" data-nav-link class="home-ref-horoscope-btn" onclick="const sel = document.getElementById('home-horoscope-select'); if (window.App && window.App.showSignHoroscope && sel) { event.preventDefault(); window.App.showSignHoroscope(sel.value); }">
      Get personalized prediction →
    </a>
  </div>
</div>

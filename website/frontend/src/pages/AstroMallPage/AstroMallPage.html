<!-- Photo Credits Modal -->
<div id="mall-credits-modal" class="shop-modal" role="dialog" aria-modal="true" style="display: none;">
  <div class="shop-modal__panel" style="background:#fff; border-radius:16px; padding:24px; max-width:500px; margin:auto;">
    <div class="shop-modal__head" style="display:flex; justify-content:space-between; margin-bottom:12px;">
      <h3 style="margin:0; font-family:'Cinzel', serif;">Photo credits</h3>
      <button type="button" class="shop-modal__x" data-close="mall-credits-modal" aria-label="Close" style="background:none; border:none; font-size:18px; cursor:pointer;">✕</button>
    </div>
    <div class="shop-modal__body"><ul class="shop-credits-list" id="mall-credits-list"></ul></div>
  </div>
</div>

<!-- Global Layout Shell Template -->
<div class="site-layout-shell" id="site-layout-shell">
  <!-- Navbar Mount Point -->
  <div id="site-navbar-mount"></div>

  <!-- Dynamic Views Container (SPA Views) -->
  <main class="site-layout-outlet" id="site-layout-outlet">
    <div id="app-views-container">
      <div id="view-home" class="app-page-view"></div>
      <div id="view-directory" class="app-page-view" style="display: none;"></div>
      <div id="view-profile" class="app-page-view" style="display: none;"></div>
      <div id="view-horoscope" class="app-page-view" style="display: none;"></div>
      <div id="view-calculators" class="app-page-view" style="display: none;"></div>
      <div id="view-panchang" class="app-page-view" style="display: none;"></div>
      <div id="view-consultation" class="app-page-view" style="display: none;"></div>
    </div>
  </main>

  <!-- Global Footer Mount Point -->
  <div id="site-footer-mount"></div>

  <!-- Modals Container -->
  <div id="modals-container"></div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toast-container"></div>
</div>
